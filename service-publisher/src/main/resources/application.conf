pekko {
  # Route Pekko's own logging through slf4j/logback (see logback.xml). Without this Pekko falls
  # back to DefaultLogger writing straight to stdout, which ignores logback.xml entirely.
  # Startup/shutdown only -- the publish stream deliberately logs nothing per message, see Main.scala.
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
}
