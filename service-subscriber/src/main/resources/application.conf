pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    blocking-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        // Must stay above DB_POOL_SIZE: in batch mode each DbWriterActor occupies one of these
        // threads for the whole DB round-trip, so a sweep past 64 would silently clip the pool factor.
        fixed-pool-size = 64
      }
      throughput = 1
    }
  }
}
