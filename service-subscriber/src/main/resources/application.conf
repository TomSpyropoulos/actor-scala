pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"

  actor {
    blocking-io-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        // Must stay above DB_POOL_SIZE + READ_POOL_SIZE: in batch mode each BatchWriterActor, and in
        // every mode each ReaderActor, occupies one of these threads for the whole DB round-trip.
        // At the largest swept pool value that is 50 + 4 = 54; going past 64 would silently clip the
        // pool factor, and would throttle this arm in a way that reads as a runtime difference.
        fixed-pool-size = 64
      }
      throughput = 1
    }
  }
}
